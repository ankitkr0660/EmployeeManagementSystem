spring.application.name=EmployeeManagementSystem
server.port=8080

# Exact Oracle Connection from your setup
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=system
spring.datasource.password=parsa
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate 6 (Spring Boot 3) Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration (Dev mode me browser refresh par updates dikhne ke liye)
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML