<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Employee - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-person-plus-fill me-2"></i>Add New Employee
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/saveEmployee}" th:object="${employee}" method="POST">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">First Name</label>
                                    <input type="text" th:field="*{firstName}" class="form-control" 
                                           th:errorclass="is-invalid" placeholder="e.g. Rahul" />
                                    <div class="invalid-feedback" th:errors="*{firstName}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Last Name</label>
                                    <input type="text" th:field="*{lastName}" class="form-control" 
                                           th:errorclass="is-invalid" placeholder="e.g. Sharma" />
                                    <div class="invalid-feedback" th:errors="*{lastName}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Work Email</label>
                                <input type="email" th:field="*{email}" class="form-control" 
                                       th:errorclass="is-invalid" placeholder="e.g. rahul.sharma@company.com" />
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Department</label>
                                <select th:field="*{department}" class="form-select" th:errorclass="is-invalid">
                                    <option value="">Select Department</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Human Resources">Human Resources</option>
                                    <option value="Finance & Accounts">Finance & Accounts</option>
                                    <option value="Operations">Operations</option>
                                    <option value="Marketing">Marketing</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{department}"></div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/}" class="btn btn-secondary px-3">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i> Save Record
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
