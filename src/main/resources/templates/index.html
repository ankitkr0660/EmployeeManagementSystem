<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-people-fill me-2"></i>EMS Portal
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Flash Success Message -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-0">Employee Directory</h3>
                        <p class="text-muted small mb-0">Manage employee details, roles, and profiles</p>
                    </div>
                    <a th:href="@{/showNewEmployeeForm}" class="btn btn-primary px-3 py-2">
                        <i class="bi bi-plus-lg me-1"></i> Add Employee
                    </a>
                </div>

                <!-- Table View -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Work Email</th>
                                <th>Department</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="emp : ${listEmployees}">
                                <td th:text="${emp.id}" class="fw-semibold"></td>
                                <td th:text="${emp.firstName}"></td>
                                <td th:text="${emp.lastName}"></td>
                                <td th:text="${emp.email}"></td>
                                <td>
                                    <span class="badge bg-secondary-subtle text-secondary-emphasis px-2 py-1" th:text="${emp.department}"></span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/showFormForUpdate/{id}(id=${emp.id})}" class="btn btn-sm btn-outline-primary me-2" title="Edit">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </a>
                                    <a th:href="@{/deleteEmployee/{id}(id=${emp.id})}" class="btn btn-sm btn-outline-danger" 
                                       onclick="return confirm('Are you sure you want to delete this employee?')" title="Delete">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listEmployees)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                    No employee records found in Oracle database. Click 'Add Employee' to insert one.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
